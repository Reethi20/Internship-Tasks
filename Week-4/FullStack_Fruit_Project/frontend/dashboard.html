<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Fruit Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <h2>Fruit Dashboard</h2>
    <button onclick="logout()">Logout</button>
</div>

<div class="form-section">
    <input type="text" id="fruit_name" placeholder="Fruit Name">
    <input type="number" id="quantity" placeholder="Quantity">
    <input type="number" id="price" placeholder="Price">
    <button onclick="addFruit()">Add Fruit</button>
</div>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Actions</th>
            <th>Basket</th>
        </tr>
    </thead>
    <tbody id="fruitTable"></tbody>
</table>

<div class="basket">
    <h3>Basket Total: ₹ <span id="total">0</span></h3>
</div>

<script src="script.js"></script>
</body>
</html>
